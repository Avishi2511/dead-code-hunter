[project]
name = "dead-code-hunter"
version = "0.1.0"
description = "Static dead-code finder for Python / FastAPI projects"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "libcst>=1.5",
    "pydantic>=2.7",
    "tomlkit>=0.13",
    "packaging>=24.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "jedi>=0.19",
]

[project.optional-dependencies]
basedpyright = ["basedpyright>=1.18"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
dch = "dch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
