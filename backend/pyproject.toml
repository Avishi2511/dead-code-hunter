[project]
name = "dead-code-hunter"
version = "0.1.0"
description = "Static dead-code finder for Python / FastAPI projects"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "libcst>=1.5",
    "pydantic>=2.7",
    "tomlkit>=0.13",
    "packaging>=24.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "jedi>=0.19",
]

[project.optional-dependencies]
basedpyright = ["basedpyright>=1.18"]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = ["pytest>=8.0", "dead-code-hunter[api]"]

[project.scripts]
dch = "dch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dch", "src/dch_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/dch/engine/scoring.py" = ["E501"]  # evidence sentences are user-facing prose
"tests/**" = ["E501"]
